<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幼小衔接·学习成长工作台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#f6f0fb,#e9f5fc); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.wrap { text-align:center; max-width:560px; width:100%; }
.logo { font-size:60px; margin-bottom:12px; }
h1 { font-size:28px; color:#5c4a6b; margin-bottom:8px; }
.sub { color:#9c8cad; font-size:15px; margin-bottom:30px; }
.cards { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.card { background:#fff; border-radius:20px; padding:26px 30px; width:230px; box-shadow:0 10px 30px rgba(120,90,160,.12); cursor:pointer; transition:.2s; text-decoration:none; color:inherit; display:block; }
.card:hover { transform:translateY(-4px); box-shadow:0 16px 36px rgba(120,90,160,.18); }
.card .emoji { font-size:52px; margin-bottom:10px; }
.card .name { font-size:20px; font-weight:800; color:#5c4a6b; margin-bottom:6px; }
.card .desc { font-size:13px; color:#9c8cad; }
.footer { margin-top:30px; color:#b0a8c0; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🌈</div>
  <h1>学习成长工作台</h1>
  <div class="sub">选择孩子喜欢的版本开始学习吧！</div>
  <div class="cards">
    <a class="card" href="pony.html">
      <div class="emoji">🦄</div>
      <div class="name">小马宝莉版</div>
      <div class="desc">紫悦 · 云宝 · 碧琪 · 苹果嘉儿</div>
    </a>
    <a class="card" href="ultraman.html">
      <div class="emoji">⚡</div>
      <div class="name">奥特曼版</div>
      <div class="desc">迪迦 · 赛罗 · 泽塔 · 假面骑士</div>
    </a>
  </div>
  <div class="footer">幼小衔接 · 学习成长工作台</div>
</div>
</body>
</html>
